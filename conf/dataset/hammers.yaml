# HAMMERS parietal-lobe MRI dataset (3D NIfTI -> 2D axial slice segmentation)
# Subjects a01-a30 (30 subjects)
# Labels: 0=background, 1..8=parietal-lobe regions (HAMMERS atlas)

name: hammers
num_classes: 9     # background + 8 parietal-lobe regions
channels: 1
image_size: 164
depth_size: 154

# 2 -> 2D axial slice segmentation (input shape: Bx1xHxW)
# 3 -> 3D volumetric segmentation  (input shape: Bx1xHxWxD)
spatial_dims: 2

data_dir: datatrain_hammers/
min_foreground_voxels: 20
num_workers: 0

val_split: 0.15
test_split: 0.15
binary_classes: null
subsample: null
